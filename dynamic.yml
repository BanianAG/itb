# Traefik's routing rules.
#
# After editing this file: `docker compose restart itb-proxy`.
#
# The user documentation has no route here -- the API serves it at /user-docs.

http:
  routers:
    itb-api:
      rule: "Host(`api.itb.localhost`) || (Host(`localhost`) && PathPrefix(`/itb-api`))"
      entryPoints:
        - web
      service: itb-api
      middlewares:
        - itb-api-strip

    itb-client:
      rule: "Host(`itb.localhost`)"
      entryPoints:
        - web
      service: itb-client

  middlewares:
    itb-api-strip:
      stripPrefix:
        prefixes:
          - "/itb-api"

  services:
    itb-api:
      loadBalancer:
        servers:
          - url: "http://itb-api:8000"

    itb-client:
      loadBalancer:
        servers:
          - url: "http://itb-client:8080"
