# ITB — three services behind a reverse proxy.
#
#   cp .env.example .env      # fill in what it marks as required
#   docker compose up -d
#
# Two things that look like something else when they go wrong:
#
#   1. The API does not start without a licence at ./license.json.
#   2. ./data must be writable by uid 65532 — see README.md, one command, once.
#
# Everything the deployment keeps lives in ./data, so it is visible and
# backup-able from the host.

services:
  itb-proxy:
    image: ${ITB_PROXY_IMAGE:-traefik:3.7.13}
    ports:
      - ${ITB_HTTP_PORT:-80}:${ITB_HTTP_PORT:-80}
      - ${ITB_DASHBOARD_PORT:-8080}:8080
    command:
      - "--api.insecure=true"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:${ITB_HTTP_PORT:-80}"
    volumes:
      - ./dynamic.yml:/etc/traefik/dynamic.yml:ro
    restart: unless-stopped

  itb-api:
    image: ${ITB_REGISTRY:-banianch}/${ITB_API_IMAGE:-itb-api}:${ITB_API_TAG:?set ITB_API_TAG in .env — see .env.example}
    volumes:
      # The licence as a single FILE, never a directory mount.
      - type: bind
        source: ${ITB_LICENSE_FILE:-./license.json}
        target: /etc/itb/license.json
        read_only: true
        bind:
          create_host_path: false
      # Your model, the generated artefacts and any packs you add:
      #
      #   ./data/users/<id>/model/        ./data/marketplace/company/
      #   ./data/users/<id>/output/       ./data/marketplace/community/
      #
      # A pack added here is picked up without a restart. `<id>` is derived from
      # the account name, so it is stable.
      #
      # Must belong to uid 65532.
      - type: bind
        source: ${ITB_DATA_DIR:-./data}
        target: /data
        bind:
          create_host_path: false
    environment:
      # Left: what the application reads. Right: what you set in .env.
      BANIAN_ITB_AUTH_MODE: ${ITB_AUTH_MODE:-local}
      BANIAN_ITB_AUTH_USERS: ${ITB_AUTH_USERS:?set ITB_AUTH_USERS in .env — see .env.example}
      BANIAN_ITB_JWT_SECRET: ${ITB_JWT_SECRET:-}
      BANIAN_ITB_CORS_ALLOW_ORIGINS: ${ITB_CORS_ALLOW_ORIGINS:-}
      BANIAN_ITB_CREDENTIAL_ENCRYPTION_KEY: ${ITB_CREDENTIAL_KEY:-}
    restart: unless-stopped

  itb-client:
    image: ${ITB_REGISTRY:-banianch}/${ITB_CLIENT_IMAGE:-itb-client}:${ITB_CLIENT_TAG:?set ITB_CLIENT_TAG in .env — see .env.example}
    environment:
      # Where the BROWSER reaches the API: the URL you type, port included.
      - API_URL=${ITB_API_URL:-http://api.itb.localhost}
      - API_PORT=${ITB_HTTP_PORT:-80}
    restart: unless-stopped

networks:
  default:
    name: itb
